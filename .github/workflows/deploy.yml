name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling them. `cancel-in-progress: true` would be
# wrong here: interrupting a Pages deployment part-way can leave the live site
# serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Detects the package manager, installs, runs `astro build`, and uploads
      # dist/ as the Pages artifact. Nothing else to configure.
      - name: Build
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        # v5, not v4. v4 targets Node 20, which the runners now force onto
        # Node 24 while printing a deprecation warning on every run.
        uses: actions/deploy-pages@v5
